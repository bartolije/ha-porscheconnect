# Self-assessment against the Home Assistant integration quality scale, rule by
# rule, checked against the official rule texts of 2026-10-16. Each comment says
# where the rule is met; tests/test_quality_scale.py covers what a rule asks to
# be tested.
rules:
  # Bronze
  action-setup:
    status: done
    comment: |
      Both actions are registered once in async_setup (services.py); a call for
      an entry that is not loaded raises ServiceValidationError.
  appropriate-polling:
    status: done
    comment: |
      One DataUpdateCoordinator polls every DEFAULT_SCAN_INTERVAL (1920 s):
      Porsche rate-limits the API. No setting in the UI; a scan_interval left
      in an entry by an older release is still honoured.
  brands:
    status: done
    comment: |
      The porscheconnect domain is in home-assistant/brands
      (custom_integrations/porscheconnect); brand/ in this folder holds this
      integration's own icon for Home Assistant's local brand images.
  common-modules:
    status: done
    comment: |
      The coordinator is in coordinator.py, the base entity in entity.py.
  config-flow-test-coverage:
    status: done
    comment: |
      config_flow.py is covered at 100 % (lines and branches), enforced in CI.
      User, captcha, reauth and reconfigure flows are each tested through both
      errors the form can show (invalid_auth, cannot_connect) and then to their
      end; duplicates and another account are refused.
  config-flow:
    status: done
    comment: |
      UI only. Required fields with email and password selectors; every field
      of every step has a label and a data_description in all seven languages.
      Credentials are stored in ConfigEntry.data; there are no options.
  dependency-transparency:
    status: done
    comment: |
      One dependency, pyporscheconnectapi-bartolije: MIT and Apache-2.0, source
      on GitHub, tagged releases published to PyPI by a public GitHub Actions
      workflow (trusted publishing).
  docs-actions:
    status: done
    comment: |
      README "Actions": climatisation_start and climatisation_stop,
      their parameters and example calls.
  docs-conditions:
    status: exempt
    comment: |
      The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions:
    status: done
    comment: |
      README "Removal": Settings → Devices & services → My Porsche Connect →
      ⋮ → Delete, then the HACS uninstall.
  docs-triggers:
    status: exempt
    comment: |
      The integration provides no triggers.
  entity-event-setup:
    status: done
    comment: |
      Entities only listen to the coordinator, through CoordinatorEntity;
      platform listeners are registered with async_on_unload.
  entity-unique-id:
    status: done
    comment: |
      Every unique_id starts with the immutable VIN (the tracker uses the VIN
      alone), so renaming the car in the Porsche app keeps entities and history.
  has-entity-name: done
  runtime-data:
    status: done
    comment: |
      The coordinator is ConfigEntry.runtime_data, typed as
      PorscheConnectConfigEntry everywhere. The only hass.data use is the
      per-entry HTTP client, which must outlive a reload and is dropped when
      the entry is removed.
  test-before-configure:
    status: done
    comment: |
      validate_input() in config_flow.py logs in before the entry is created.
  test-before-setup:
    status: done
    comment: |
      async_setup_entry awaits the coordinator's first refresh; the coordinator
      raises ConfigEntryAuthFailed for refused credentials, a 401 or a captcha,
      and UpdateFailed (ConfigEntryNotReady at setup) for anything else.
  unique-config-entry:
    status: done
    comment: |
      unique_id is the lower-cased email; the user flow aborts on a duplicate.

  # Silver
  action-exceptions:
    status: done
    comment: |
      Entity actions (lock, switch, button, number, climate) and both services
      raise HomeAssistantError when Porsche refuses or fails, and
      ServiceValidationError for wrong input (unknown device, missing PIN,
      unsupported zone).
  config-entry-unloading:
    status: done
    comment: |
      async_unload_entry unloads the platforms; listeners are removed through
      async_on_unload. Home Assistant owns and closes the HTTP client.
  docs-configuration-parameters:
    status: exempt
    comment: |
      No options flow.
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: |
      Entities are unavailable when the coordinator's update fails and when
      their car is no longer on the account (entity.py).
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      The coordinator raises UpdateFailed, so DataUpdateCoordinator logs once
      when Porsche becomes unreachable and once when it is back.
  parallel-updates:
    status: done
    comment: |
      Read-only platforms (sensor, binary_sensor, device_tracker, image)
      declare PARALLEL_UPDATES = 0: they read the shared coordinator.
      Platforms that send commands (lock, switch, button, number, climate)
      declare PARALLEL_UPDATES = 1: one command at a time per platform.
  reauthentication-flow:
    status: done
    comment: |
      Refused credentials, a 401 or a captcha during an update raise
      ConfigEntryAuthFailed, which opens async_step_reauth. Throttled logins
      are retried instead: the password is not in question.
  test-coverage:
    status: done
    comment: |
      Every module is above 95 % (lines and branches); CI fails on any module
      below it, not only on the total.

  # Gold
  devices:
    status: done
    comment: |
      One device per car: VIN as identifier and serial number, name, model,
      model code and manufacturer.
  diagnostics:
    status: done
    comment: |
      diagnostics.py redacts the password, tokens, position, coordinates,
      addresses and pairing secrets, and masks the email and the VIN.
  discovery-update-info:
    status: exempt
    comment: |
      Cloud service, nothing to discover on the network.
  discovery:
    status: exempt
    comment: |
      Cloud service, nothing to discover on the network.
  docs-data-update:
    status: done
    comment: |
      README "How data is updated".
  docs-examples:
    status: done
    comment: |
      README "Examples": a dashboard card and automations.
  docs-known-limitations:
    status: done
    comment: |
      README "Known limitations".
  docs-supported-devices:
    status: done
    comment: |
      README "Supported cars".
  docs-supported-functions:
    status: done
    comment: |
      README "What you get": the entities by purpose, then every entity with
      the condition under which it is created.
  docs-troubleshooting:
    status: done
    comment: |
      README "Troubleshooting".
  docs-use-cases:
    status: done
    comment: |
      README "What you can do".
  dynamic-devices:
    status: done
    comment: |
      The coordinator reads the account's vehicle list on every refresh and
      every platform adds entities for a new car without a reload, including a
      car that comes back after its device was removed.
  entity-category:
    status: done
    comment: |
      Service intervals, tire pressures, contract and update timestamps, flags
      of the account and the refresh button are diagnostic; what a driver looks
      at (range, fuel, battery, doors, lock, position) keeps the default.
  entity-device-class:
    status: done
    comment: |
      Every entity with a matching device class has one. Those without
      (charging target, fuel level and reserve, trips of the month, fuel
      consumption, account flags, buttons and switches) have none that fits.
  entity-disabled-by-default:
    status: done
    comment: |
      Redundant or rarely used entities are disabled by default: charging
      rate, fuel reserve, per-tire pressures, secondary service intervals,
      remote access, spoiler and service flap, the climatisation switch (the
      climate entity does the same) and four of the five pictures.
  entity-translations: done
  exception-translations:
    status: done
    comment: |
      Every error shown to the user has a translation key: the coordinator's
      UpdateFailed and ConfigEntryAuthFailed, and the HomeAssistantError and
      ServiceValidationError of the entity actions and services.
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: |
      A car without an active Porsche Connect contract raises a repair issue
      that says how to renew it. When the contract is back, the issue goes
      away and the entry is reloaded so that the entities come back.
  stale-devices:
    status: done
    comment: |
      A car missing from the account for two refreshes in a row has its device
      removed (coordinator.py); one odd answer from Porsche removes nothing.
      async_remove_config_entry_device also lets the user remove it by hand.

  # Platinum
  async-dependency: done
  inject-websession:
    status: done
    comment: |
      The library gets a client from create_async_httpx_client(hass), dedicated
      so that it can refuse zstd, which httpx2 fails to decode.
  strict-typing:
    status: done
    comment: |
      mypy --strict runs in CI on the integration; the library ships py.typed
      and the typed config entry is used throughout.
