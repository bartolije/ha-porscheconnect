rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: |
      Polls every DEFAULT_SCAN_INTERVAL (1920 s) via DataUpdateCoordinator;
      the interval is also overridable via CONF_SCAN_INTERVAL.
  brands:
    status: exempt
    comment: |
      Brand is "Porsche" — added to home-assistant/brands separately, not
      part of this repository.
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: Tests cover happy path, wrong creds, already_configured, captcha, reauth.
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: done
    comment: |
      README "Services / Actions" section documents climatisation_start
      parameters, dynamic zone behaviour (#292), and example calls.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions:
    status: done
    comment: |
      README "Removal" section: HA UI → Devices → Porsche Connect → Delete,
      plus optional OAuth grant revocation and HACS uninstall.
  entity-event-setup: done
  entity-unique-id:
    status: done
    comment: |
      All platforms now derive unique_id from the immutable VIN
      (``f"{self._vin}-{description.key}"``) so renaming the car in the
      Porsche app does not break entity history.
  has-entity-name: done
  runtime-data:
    status: done
    comment: |
      Coordinator is attached as ``entry.runtime_data``; every platform's
      ``async_setup_entry`` reads from it instead of ``hass.data``.
  test-before-configure:
    status: done
    comment: validate_input() in config_flow performs a login round-trip.
  test-before-setup:
    status: done
    comment: |
      ``async_setup_entry`` performs ``async_config_entry_first_refresh``
      and converts 401 to ConfigEntryAuthFailed / other errors to
      ConfigEntryNotReady.
  unique-config-entry:
    status: done
    comment: |
      unique_id = email.lower().strip(); ``_abort_if_unique_id_configured``
      enforced on user flow.

  # Silver
  action-exceptions:
    status: done
    comment: |
      Service handlers translate PorscheExceptionError into HomeAssistantError
      and use ServiceValidationError for invalid device ids.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: No options flow.
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: |
      Entities inherit from CoordinatorEntity, so ``available`` automatically
      reflects coordinator update success.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      DataUpdateCoordinator logs at WARNING when an update fails; auth
      failures are surfaced through ConfigEntryAuthFailed which HA
      narrates to the user.
  parallel-updates:
    status: done
    comment: |
      Every platform declares ``PARALLEL_UPDATES = 0`` since entities
      read-only from the shared coordinator.
  reauthentication-flow:
    status: done
    comment: |
      401 / PorscheWrongCredentialsError raised from coordinator updates
      and from initial setup trigger ConfigEntryAuthFailed, which routes
      the user into ``async_step_reauth``.
  test-coverage:
    status: done
    comment: Coordinator + setup/unload + auth paths covered (11 tests).

  # Gold (declared here so review tooling sees explicit positions)
  devices: done
  diagnostics:
    status: done
    comment: |
      ``diagnostics.async_get_config_entry_diagnostics`` redacts password,
      access/refresh tokens, addresses; masks the email local-part and VIN
      (last 4 chars); blurs coordinates to 1 decimal. Includes per-vehicle
      capability flags and coordinator update state.
  discovery-update-info:
    status: exempt
    comment: Cloud-polling integration, no local discovery.
  discovery:
    status: exempt
    comment: Cloud-polling integration, no local discovery.
  docs-data-update:
    status: done
    comment: README "Polling and data updates" — 1920 s tick + extra refresh triggers.
  docs-examples:
    status: done
    comment: |
      README "Examples" section: Lovelace card + 4 automation recipes
      (pre-heat, door-open alert, charging logbook, geofence arrival).
  docs-known-limitations:
    status: done
    comment: |
      README "Known limitations": subscription required, charging-profile
      target-SoC bug (#319), no Car Connect support, captcha at first login,
      PCM pairing requirement, no 2FA, no push notifications.
  docs-supported-devices:
    status: done
    comment: README "Supported vehicles" — per-model capability matrix.
  docs-supported-functions:
    status: done
    comment: |
      README "Supported entities and capabilities" — 27-row table mapping
      each entity to its underlying capability gate.
  docs-troubleshooting:
    status: done
    comment: |
      README "Troubleshooting": captcha, empty payload / PCM pairing,
      reauth, unlock S-PIN, missing vehicle, debug logger recipe.
  docs-use-cases:
    status: done
    comment: README "Examples" doubles as use-cases (4 worked automations).
  dynamic-devices:
    status: done
    comment: |
      Every platform registers a coordinator listener that creates
      entities for VINs appearing after the initial refresh — newly
      paired vehicles show up without restarting Home Assistant.
  entity-category:
    status: done
    comment: |
      Diagnostic category applied to non-primary entities: remote_access /
      privacy_mode / tire_pressure_status binary sensors, and the
      ``get_current_overview`` refresh button. Primary state (battery,
      doors, parking, range, mileage, lock, location, images, switches)
      keeps the default user-facing category.
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: |
      Disabled by default: ``charging_rate`` (redundant with charging_power),
      ``remote_access`` binary sensor (account-side config flag), and four of
      the five vehicle photos (only side_view stays on by default to avoid
      shipping 5 image entities per car). Everything user-facing (battery,
      doors, location, lock, climate, mileage, range, fuel, charging
      status/power/finished) stays enabled.
  entity-translations: done
  exception-translations:
    status: done
    comment: |
      All HomeAssistantError / ServiceValidationError raised by the
      integration carry ``translation_domain`` + ``translation_key`` and
      have matching ``exceptions.*`` entries in strings.json and
      translations/en.json (climatisation_not_supported,
      climate_zone_not_supported, invalid_device_id,
      no_config_entry_for_device, remote_service_failed, lock_failed,
      unlock_failed, pin_code_missing).
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: |
      No actionable repair conditions detected beyond the standard
      reauth path, which HA surfaces as a repair automatically.
  stale-devices:
    status: done
    comment: |
      ``async_remove_config_entry_device`` permits removal whenever the
      device's VINs are no longer present on the linked account.

  # Platinum
  async-dependency: done
  inject-websession:
    status: done
    comment: |
      ``get_async_client(hass)`` is forwarded to the API client.
  strict-typing:
    status: todo
    comment: |
      Most public surface is typed; some legacy helpers still untyped.
