name: Release zip

# HACS installs from this zip (hacs.json: zip_release), so its download count
# on each release is the number of HACS installs and updates of that version.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)attach the zip to
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    # Waits for the maintainer's approval: HACS installs from this zip.
    environment: release
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Build porscheconnect.zip and attach it to the release
        working-directory: custom_components/porscheconnect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          if [ "$version" != "$TAG" ]; then
            echo "::error::Release tag $TAG, but manifest.json says version $version"
            exit 1
          fi
          zip -r "$RUNNER_TEMP/porscheconnect.zip" . -x '*__pycache__*'
          unzip -l "$RUNNER_TEMP/porscheconnect.zip" | grep -q ' manifest.json$'
          gh release upload "$TAG" "$RUNNER_TEMP/porscheconnect.zip" --clobber
